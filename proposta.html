      <h2>Carregando proposta…</h2>
    </div>
  </div>

<script type="module">
import { PRODUCTS } from "./products-data.js?v=20261001b";
/* ---- Prova Social iGaming (inlined) ---- */



const p = new URLSearchParams(location.search);
const clienteRaw = p.get("cliente") || "";
const planoId    = (p.get("plano") || "creator").toLowerCase();
const prazo      = parseInt(p.get("prazo") || "3", 10);
const desconto   = parseFloat(p.get("desconto") || "0");
const extrasIds  = (p.get("extras") || "").split(",").map(s => s.trim()).filter(Boolean);
const sobreTexto = p.get("sobre") || "";
const avulsosNomes = (p.get("avulsos") || "").split("|").map(s => s.trim()).filter(Boolean);
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const root = document.getElementById("pr-root");

const fc = PRODUCTS["fabrica-criativa"];
if (!fc) { root.innerHTML = "<p>Dados não encontrados.</p>"; throw new Error("PRODUCTS not loaded"); }

// Localiza o plano no array fc.plans
const plano = (fc.plans || []).find(pl => pl.id === planoId);

if (!plano) {
  root.innerHTML = `<div class="pr-no-params"><h2>Plano "${planoId}" não encontrado.</h2><p>Use: capture, creator ou completo</p></div>`;
  throw new Error("Plano not found");
}

// Add-ons de qualquer plano (site e ensaio, por exemplo, só estão listados no Completo)
const todosBumps = new Map();
Object.values(fc.bumps || {}).flat().forEach(b => { if (!todosBumps.has(b.id)) todosBumps.set(b.id, b); });
(fc.bumps?.[planoId] || []).forEach(b => todosBumps.set(b.id, b));
const extrasEscolhidos = extrasIds.map(id => todosBumps.get(id)).filter(Boolean);

// Preços
const precoBase = plano.price || 0;
let totalMensal = precoBase + extrasEscolhidos.filter(b => b.recurring !== false).reduce((s, b) => s + b.price, 0) + extrasEscolhidos.reduce((s, b) => s + (b.monthly || 0), 0);
const totalUnico = extrasEscolhidos.filter(b => b.recurring === false).reduce((s, b) => s + b.price, 0);
const descontoValor = desconto > 0 ? Math.round(precoBase * desconto / 100) : 0;
const primeiroMes = totalMensal - descontoValor;

const fmt = (n) => "R$ " + n.toLocaleString("pt-BR");
const hoje = new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });

const cliente = esc(clienteRaw || "Cliente");
const planoNome = plano.name || "Plano";

// Extrai todos os bullets de groups[].items e groups[].extras
const includesArr = (plano.groups || []).flatMap(g => [
  ...(g.items || []),
  ...(g.extras || []),
]);

const includesHtml = includesArr.length
  ? includesArr.map(item => `<li>${item}</li>`).join("")
  : `<li>${plano.hook || "Operação completa de marketing"}</li>`;

// Extras
const extrasHtml = extrasEscolhidos.length ? `
  <p class="pr-section-title">Add-ons incluídos nesta proposta</p>
  <div class="pr-extras-list">
    ${extrasEscolhidos.map(b => `
      <div class="pr-extra-item">
        <div>
          <div class="pr-extra-name">${b.name}</div>
          <div class="pr-extra-desc">${b.desc || ""} ${b.recurring === false ? `<em>· Valor único${b.monthly ? ` + ${fmt(b.monthly)}/mês` : ""}</em>` : "· Recorrente"}</div>
        </div>
        <div class="pr-extra-price">${fmt(b.price)}</div>
      </div>
    `).join("")}
  </div>
` : "";

const avulsosHtml = avulsosNomes.length ? `
  <p class="pr-section-title">Serviços avulsos que você pediu</p>
  <div class="pr-extras-list">
    ${avulsosNomes.map(n => `
      <div class="pr-extra-item">
        <div><div class="pr-extra-name">${esc(n)}</div><div class="pr-extra-desc">Orçamento conforme data, local e duração.</div></div>
        <div class="pr-extra-price">Na conversa</div>
      </div>`).join("")}
  </div>
` : "";

// Totais
const descontoHtml = descontoValor ? `<div class="pr-total-row"><span>Desconto de ${desconto}% no plano (1º mês)</span><span class="val">−${fmt(descontoValor)}</span></div>` : "";
const unicoHtml = totalUnico > 0 ? `<div class="pr-total-row"><span>Add-ons únicos (1× entrada)</span><span>${fmt(totalUnico)}</span></div>` : "";

// WhatsApp CTA
const waMsg = encodeURIComponent(`Olá! Recebi a proposta LORDS para o plano ${planoNome} (${prazo} meses) e tenho interesse em fechar. Podemos conversar?`);
/* Sem número oficial de WhatsApp ainda (27/09/2026): o fechamento vai pela agenda. */
const waUrl = `https://calendly.com/lordropservice/30min`;

// Render
document.title = `Proposta ${planoNome} — ${cliente} · LORDS Creative`;

root.innerHTML = `
  <div class="pr-header">
    <a href="home.html" class="pr-brand" aria-label="LORDS">
      <span class="brand-mark">L</span>
      <span class="brand-text">LORDS</span>
    </a>
    <div class="pr-meta">
      <div>Proposta gerada em <strong>${hoje}</strong></div>
      <div>Contrato de <strong>${prazo} ${prazo === 1 ? "mês" : "meses"}</strong></div>
      ${desconto > 0 ? `<div style="color:var(--gold);font-weight:700;">${desconto}% de desconto aplicado</div>` : ""}
      <a class="pr-email-link" href="mailto:contato@lordsoficial.com">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
        contato@lordsoficial.com
      </a>
    </div>
  </div>

  <span class="pr-kicker">Fábrica Criativa</span>
  <h1 class="pr-title">Proposta para <em>${cliente}</em></h1>
  <p class="pr-subtitle">Estratégia, câmera e edição — vídeos que geram autoridade e vendem todo mês.</p>
